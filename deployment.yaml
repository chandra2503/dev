apiVersion: app/v1
kind: Deployment
metadata:
    name: nginx-deployment
      labels:
            app: my-deployment-app
            spec:
                replicas: 2
                  selector:
                        matchLabels:
                                app: my-app 
                                       template:
                                             metadata:
                                                     labels:
                                                               app: my-app
                                                                   spec:
                                                                           containers:
                                                                                   - name: devops-app
                                                                                                 image: nginix
                                                                                                         ports:
                                                                                                                   - containerPort: 80

